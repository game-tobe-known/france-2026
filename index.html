<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>France 2026</title>
<meta name="description" content="Place de la République, Paris, 17 October 2026. The protests sweeping France, rebuilt as a single square: choose the time you arrive, walk, and read the record. Based on news reports.">
<meta property="og:type" content="website">
<meta property="og:title" content="France 2026">
<meta property="og:description" content="The protests sweeping France, rebuilt as a single square. Choose the time you arrive. There is no right answer.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=GFS+Didot&family=Permanent+Marker&display=swap">
<style>
/* Layout: built for a phone held upright. Title, clock and the reading dock on top; the 3D scene fills the screen. */
:root{
  color-scheme: dark;
  --bg:#07080b;
  --ink:#ece8e1;
  --ink-dim:rgba(236,232,225,.64);
  --ink-faint:rgba(236,232,225,.36);
  --line:rgba(236,232,225,.2);
  --panel:rgba(8,10,14,.82);
  --scan:#9fdce6;
  --voice:#e9b872;
  --fire:#ff8a3d;
  --f-display:"GFS Didot","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Noto Sans",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --pad-l:max(14px,env(safe-area-inset-left,0px));
  --pad-r:max(14px,env(safe-area-inset-right,0px));
  --pad-t:max(12px,env(safe-area-inset-top,0px));
  --pad-b:max(12px,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,svg:focus-visible{outline:1px solid var(--scan);outline-offset:3px}
a{color:inherit}
[hidden]{display:none!important}
.glass{background:rgba(7,8,11,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line)}

/* ---------- top HUD ---------- */
.hud-top{position:fixed;top:0;left:0;right:0;padding:var(--pad-t) var(--pad-r) 0 var(--pad-l);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.05em;line-height:1;display:flex;flex-direction:column;gap:3px}
.langs{display:flex;flex-wrap:wrap;border:1px solid var(--line);margin-bottom:4px}
.langs button{font-size:12px;padding:7px 11px;min-height:34px;color:var(--ink-dim)}
.langs button{border-right:1px solid var(--line)}
.langs button[aria-pressed="true"]{color:var(--ink);background:rgba(236,232,225,.1)}
.stick{position:fixed;z-index:6;left:0;top:0;margin:-48px 0 0 -48px;width:96px;height:96px;border-radius:50%;border:1px solid rgba(236,232,225,.38);background:radial-gradient(circle,rgba(7,8,11,.15),rgba(7,8,11,.45));pointer-events:none;display:grid;place-items:center}
.stick i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(236,232,225,.22);border:1px solid rgba(236,232,225,.6);transition:transform .08s}
.stick span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;color:var(--ink-dim);letter-spacing:.06em}
.stick.auto{border-style:dashed;opacity:.75}
.stick.auto span{color:var(--scan)}
.stick.on i{background:rgba(159,220,230,.35);border-color:var(--scan)}
.stick.ghost{opacity:.7}
.stick.ghost i{animation:ghostk 2.2s ease-in-out infinite}
@keyframes ghostk{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px)}65%{transform:translate(20px,0)}}
.clockbtn{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;min-height:36px}
.clockbtn svg{width:18px;height:18px;flex:none}
.clockbtn .tt{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.clockbtn .tl{font-size:10.5px;color:var(--ink-dim)}
.carnet{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-dim);white-space:nowrap}
.reflect-cta{margin-top:2px;font-size:12px;color:var(--voice);border:1px solid rgba(233,184,114,.5);padding:7px 10px;background:rgba(7,8,11,.5);align-self:flex-start}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.tool{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;padding:0 10px;min-height:36px;min-width:36px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.tool[aria-pressed="true"]{border-color:var(--scan);color:var(--scan)}
.seg{display:flex}
.tool.view{border-color:rgba(236,232,225,.45);font-family:var(--f-body);font-size:12px;letter-spacing:.02em}
.seg .tool+.tool{border-left:0}

/* ---------- bottom ---------- */
.bottom{position:fixed;left:0;right:0;top:var(--dockTop,104px);padding:0 var(--pad-r) 0 var(--pad-l);z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.brow{display:flex;align-items:center;gap:10px}
.ticker{display:flex;flex-direction:column;gap:3px;max-width:560px}
.tick{font-size:12px;line-height:1.5;color:var(--ink-dim);display:grid;grid-template-columns:52px 1fr;gap:8px;animation:tin .6s ease both}
.tick:last-child{color:var(--ink)}
.tick .t{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint)}
.tick .city{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px;color:var(--ink-faint)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nowrow{display:flex;gap:8px;align-items:stretch;pointer-events:auto}
.evcard{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:10px 12px;text-align:left}
.evcard .k{grid-column:1/3;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--scan);text-transform:uppercase}
.evcard.fire .k{color:var(--fire)}
.evcard b{grid-column:1/3;font-weight:500;font-size:15px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.evcard .go{grid-row:1/3;grid-column:3;font-size:12px;color:var(--ink-dim);border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
.evcard.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(255,138,61,.35)}100%{background:rgba(7,8,11,.5)}}
.auto{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:0 10px;min-width:74px;font-size:11px;color:var(--ink-dim)}
.auto i{width:28px;height:15px;border:1px solid var(--ink-faint);border-radius:8px;position:relative;display:block}
.auto i::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--ink-faint);transition:transform .2s,background .2s}
.auto[aria-pressed="true"]{color:var(--scan);border-color:rgba(159,220,230,.5)}
.auto[aria-pressed="true"] i{border-color:var(--scan)}
.auto[aria-pressed="true"] i::after{transform:translateX(13px);background:var(--scan)}

.timeline{pointer-events:auto;display:flex;align-items:center;gap:6px}
.tbtn{height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;gap:4px;flex:none;font-size:15px;padding:0 8px}
.tbtn small{font-family:var(--f-mono);font-size:10px;color:var(--ink-dim)}
.tbtn.speed{font-family:var(--f-mono);font-size:13px;min-width:46px;font-variant-numeric:tabular-nums}
.tbtn.speed.fast{color:var(--fire);border-color:rgba(255,138,61,.6)}
.track{position:relative;flex:1;min-width:0;height:40px}
.track input{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:40px;margin:0}
.track input::-webkit-slider-runnable-track{height:1px;background:var(--line)}
.track input::-moz-range-track{height:1px;background:var(--line)}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:26px;margin-top:-13px;background:transparent;border:0;border-left:2px solid var(--scan);border-right:0}
.track input::-moz-range-thumb{width:2px;height:26px;background:var(--scan);border:0;border-radius:0}
.track .fill{position:absolute;left:0;top:19px;height:1px;background:var(--ink-faint);pointer-events:none}
.chip{position:absolute;top:0;width:24px;height:22px;margin-left:-12px;display:grid;place-items:center;z-index:2}
.chip::before{content:"";width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--scan);background:var(--bg)}
.chip.fire::before{border-color:var(--fire)}
.chip.past::before{background:var(--scan)}
.chip.fire.past::before{background:var(--fire)}
.chip.cur::before{width:10px;height:10px;box-shadow:0 0 10px currentColor}
.chip.fire{color:var(--fire)}
.track .hr{position:absolute;bottom:0;font-family:var(--f-mono);font-size:9px;color:var(--ink-faint);transform:translateX(-50%);pointer-events:none}
.toast{align-self:flex-start;font-size:12.5px;line-height:1.6;padding:8px 12px;pointer-events:none;animation:tin .5s ease both;text-align:center;max-width:92vw}
.toast b{color:var(--scan);font-weight:500}
/* wide screens: the whole top is one 40px bar — title, clock, now-card, time bar, tools (placed by placeDock) */
.hud-top.wide{align-items:center}
.hud-top.wide .brand{flex-direction:row;align-items:center;gap:12px}
.hud-top.wide .brand b{white-space:nowrap}
.hud-top.wide .clockbtn,.hud-top.wide .tool{min-height:40px}
.bottom.wide{left:var(--dockL);right:var(--dockR);padding:0;display:grid;grid-template-columns:minmax(260px,42%) 1fr;gap:8px;align-items:start}
.bottom.wide .toast{grid-column:1/-1}
.bottom.wide .ticker{position:fixed;inset-inline-start:var(--pad-l);top:calc(var(--dockTop) + 54px);width:min(420px,40vw)}
.bottom.wide .nowrow{height:40px}
.bottom.wide .evcard{grid-template-columns:auto 1fr;padding:0 12px;gap:0 10px}
.bottom.wide .evcard .k{grid-column:1;white-space:nowrap}
.bottom.wide .evcard b{grid-column:2;font-size:13.5px;-webkit-line-clamp:1}
.bottom.wide .evcard:hover{border-color:var(--scan)}
.bottom.wide .auto{flex-direction:row;gap:6px;min-width:0;font-size:11px}
.bottom.wide .toast{font-size:12px;padding:6px 10px}
/* medium-wide: drop button captions so the middle of the bar has room */
.hud-top.tight .tool .lg,.hud-top.tight .clockbtn .tl,.bottom.tight .tbtn small{display:none}
.bottom.tight{grid-template-columns:1fr 1fr}

/* ---------- event pointer ---------- */
.evp{position:fixed;left:0;top:0;z-index:4;pointer-events:none;will-change:transform}
.evp .ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border:1px solid var(--scan);border-radius:50%;animation:pulse 1.8s ease-out infinite}
.evp.fire .ring{border-color:var(--fire)}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.evp .arrow{position:absolute;left:-18px;top:-14px;width:36px;height:28px;display:none}
.evp .arrow svg{width:36px;height:28px;display:block;animation:nudge 1s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(7,8,11,.8))}
@keyframes nudge{0%,100%{transform:translateX(-4px)}50%{transform:translateX(8px)}} /* the parent is rotated, so this moves along the arrow */
.evp .lab{position:absolute;left:0;top:28px;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:4px 8px;background:rgba(7,8,11,.62);border-top:1px solid var(--scan)}
.evp.fire .lab{border-top-color:var(--fire)}
.evp .lab em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--ink-dim);margin-left:6px}
.evp.off .ring{display:none}
/* callout: the label sits off to the side, joined to the ring by a bent leader line (drawn in JS, kept on screen) */
.evp .lead{position:absolute;left:0;top:0;width:1px;height:1px;display:none;overflow:visible;color:var(--scan);pointer-events:none}
.evp.fire .lead{color:var(--fire)}
.evp:not(.off) .lead{display:block}
.evp:not(.off) .lab{transform:none;border-top:0;border-left:2px solid var(--scan);max-width:48vw}
.evp.fire:not(.off) .lab{border-left-color:var(--fire)}
.evp:not(.off) .ring,.evp:not(.off) .lab,.evp.off .arrow{pointer-events:auto;cursor:pointer}
.evp .ring{background:radial-gradient(circle,rgba(159,220,230,.18),rgba(159,220,230,0) 70%)}
.evp.fire .ring{background:radial-gradient(circle,rgba(255,138,61,.2),rgba(255,138,61,0) 70%)}
.evp .lab .cta{display:block;margin-top:3px;font-size:11px;color:var(--scan);font-weight:500}
.evp.fire .lab .cta{color:var(--fire)}
.evp.off .lab .cta{display:none}
.mk:not(.seen) .d{animation:mkp 1.6s ease-in-out infinite}
@keyframes mkp{0%,100%{box-shadow:0 0 0 0 rgba(159,220,230,.7)}60%{box-shadow:0 0 0 7px rgba(159,220,230,0)}}
.mk.faint.near{opacity:1}
.mk.faint.near .n{display:block}
.evcard .go .pt{display:inline-block;font-style:normal;margin-right:5px}
.fresh .evcard .go .pt{animation:poke 1.1s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.bottom.wide .evcard .go{display:block;font-size:17px;align-self:center}
.bottom.wide .evcard .go [data-i18n]{display:none}
.bottom.wide .evcard .go .pt{margin:0}
.evp.off .arrow{display:block}

/* ---------- hover brackets & markers ---------- */
.brk{position:fixed;pointer-events:none;z-index:4}
.brk i{position:absolute;width:12px;height:12px;border-color:var(--scan);border-style:solid;border-width:0}
.brk i:nth-child(1){left:0;top:0;border-left-width:1px;border-top-width:1px}
.brk i:nth-child(2){right:0;top:0;border-right-width:1px;border-top-width:1px}
.brk i:nth-child(3){left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
.brk i:nth-child(4){right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
.brk .lbl{position:absolute;left:0;bottom:calc(100% + 8px);white-space:nowrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--scan);background:rgba(7,8,11,.6);padding:4px 7px;border-left:1px solid var(--scan)}
.brk .lbl span{color:var(--ink);font-family:var(--f-body);letter-spacing:.02em;margin-left:8px}
.mk{position:fixed;z-index:4;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto;padding:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--scan)}
.mk .d{width:9px;height:9px;border:1px solid currentColor;transform:rotate(45deg);background:rgba(7,8,11,.4)}
.mk.seen .d{background:currentColor}
.mk .n{background:rgba(7,8,11,.6);padding:2px 5px;white-space:nowrap}
.mk.faint{opacity:.55}
.mk.faint .n{display:none}
.mk .stem{width:1px;height:14px;background:linear-gradient(var(--scan),transparent)}

/* ---------- panel ---------- */
.panel{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);backdrop-filter:blur(16px) saturate(.8);-webkit-backdrop-filter:blur(16px) saturate(.8);border-left:1px solid var(--line);padding:calc(var(--pad-t) + 6px) var(--pad-r) calc(var(--pad-b) + 10px) 24px;overflow-y:auto;transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.1,1);-webkit-user-select:text;user-select:text}
.panel.open{transform:none}
.panel header{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--scan);border-bottom:1px solid var(--line);padding-bottom:10px;position:sticky;top:-1px;background:inherit}
.panel .x{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink)}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:18px 0 2px;text-wrap:balance}
.panel .sub{margin:0 0 6px;color:var(--ink-dim);font-size:14px}
.panel section{margin-top:22px;animation:rise .5s ease both}
.panel section:nth-of-type(2){animation-delay:.08s}
.panel section:nth-of-type(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel h3{font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.panel h3::after{content:"";flex:1;height:1px;background:var(--line)}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{font-size:14px;line-height:1.75;padding-left:14px;position:relative}
.facts li::before{content:"";position:absolute;left:0;top:.8em;width:5px;height:1px;background:var(--scan)}
.src{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--scan);text-decoration:none;border-bottom:1px solid rgba(159,220,230,.35);margin-left:4px;white-space:nowrap}
.voice{margin:0 0 14px;padding:0 0 0 14px;border-left:1px solid rgba(233,184,114,.55)}
.voice p{margin:0;font-size:15px;line-height:1.8}
.voice cite{display:block;margin-top:6px;font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--voice)}
.voice cite em{font-style:normal;color:var(--ink-faint);margin-left:6px}
.q p{font-size:16px;line-height:1.85;margin:0;color:var(--ink)}
.panel .note{margin-top:26px;font-size:11px;line-height:1.7;color:var(--ink-faint)}

/* ---------- picker (clock) ---------- */
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:calc(var(--pad-t) + 8px) var(--pad-r) calc(var(--pad-b) + 8px) var(--pad-l);background:linear-gradient(180deg,rgba(7,8,11,.88) 0%,rgba(7,8,11,.35) 34%,rgba(7,8,11,.35) 62%,rgba(7,8,11,.92) 100%);transition:opacity .6s;overflow-y:auto}
.ov.hide{opacity:0;pointer-events:none}
.picker{width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;text-align:center}
.head{display:flex;flex-direction:column;align-items:center;gap:8px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim)}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,14vw,104px);line-height:.95;margin:0;white-space:nowrap}
.lead{font-size:14px;line-height:1.85;margin:0;color:var(--ink)}
.ingame .title,.ingame .lead-intro{display:none}
.lead-game{display:none}
.ingame .lead-game{display:block}
.dial-wrap{position:relative;width:min(80vw,46svh,340px);aspect-ratio:1;flex:none}
#dial{width:100%;height:100%;display:block;touch-action:none;cursor:grab;overflow:visible}
#dial .hl{font-family:var(--f-mono);font-size:11px;fill:rgba(236,232,225,.5)}
#dial .ev .dm{fill:#07080b;stroke:var(--scan);stroke-width:1.2}
#dial .ev.fire .dm{stroke:var(--fire)}
#dial .ev.past .dm{fill:var(--scan)}
#dial .ev.fire.past .dm{fill:var(--fire)}
#dial .ev .hit{fill:transparent;cursor:pointer}
#dial .ev.rec .dm{stroke-width:1.6}
#dial .halo{fill:none;stroke:var(--fire);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
#dial .reclab{font-size:11px;fill:var(--fire);font-family:var(--f-body)}
#dial .ev.rec:not(.fire) .halo{stroke:var(--scan)}
#dial #handL{stroke:var(--ink);stroke-width:1.2}
#dial #knob{fill:var(--ink)}
.dial-c{position:absolute;inset:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none}
.dial-c .dt{font-family:var(--f-display);font-size:clamp(34px,10vw,50px);line-height:1;font-variant-numeric:tabular-nums}
.dial-c .de{font-size:12px;line-height:1.5;color:var(--ink-dim);text-wrap:balance}
.dial-c .de.fire{color:var(--fire)}
.choices{display:flex;gap:8px;width:100%}

.reflect{background:rgba(7,8,11,.92);justify-content:flex-start}
/* why this game exists: read once before the clock; lines rise one after another on a first visit */
.purpose{z-index:11;background:rgba(7,8,11,.95);justify-content:flex-start}

.pu-inner{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
.pu-inner h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.1;margin:0 0 4px;text-wrap:balance}
.pu-inner p{margin:0;font-size:clamp(14px,3.9vw,16px);line-height:1.9;color:var(--ink)}
.pu-inner .pu-ai{font-size:12px;line-height:1.8;color:var(--ink-dim);border-top:1px solid var(--line);padding-top:12px}
.pu-go{flex:0 0 auto;align-self:flex-start;min-width:180px;margin-top:6px}
.purpose:not(.on) .pu-inner>*{opacity:0}
.purpose.on .pu-inner>*{animation:rise 1s ease both}
.purpose.on .pu-inner>:nth-child(2){animation-delay:.3s}
.purpose.on .pu-inner>:nth-child(3){animation-delay:1s}
.purpose.on .pu-inner>:nth-child(4){animation-delay:2.2s}
.purpose.on .pu-inner>:nth-child(5){animation-delay:3.4s}
.purpose.on .pu-inner>:nth-child(6){animation-delay:4.6s}
.purpose.on .pu-inner>:nth-child(7){animation-delay:5.6s}

.reflect .qq{font-size:clamp(20px,5.2vw,30px);line-height:1.65;font-weight:500;margin:0;text-wrap:balance;animation:rise .9s ease both}
.reflect .row{display:flex;gap:10px;flex-wrap:wrap}
.reflect .choice{flex:0 1 auto;align-items:flex-start;min-width:160px}
.credits{font-size:12px;line-height:1.8;color:var(--ink-dim)}
.credits ul{padding-left:1.1em;margin:6px 0}
.credits a{color:var(--scan)}
.credits details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.credits summary{cursor:pointer;list-style:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--ink-faint);padding:4px 0;display:flex;gap:8px;align-items:baseline}
.credits summary::-webkit-details-marker{display:none}
.credits summary::before{content:"▸";letter-spacing:0;transition:transform .2s}
.credits details[open] summary::before{transform:rotate(90deg)}
.credits summary:hover{color:var(--ink-dim)}
.credits summary em{font-style:normal;margin-inline-start:auto;letter-spacing:.05em}
.makers{list-style:none;padding:0!important;margin:6px 0 0!important;display:flex;flex-direction:column;gap:8px}

  float a = (1.-d); a *= a*a;

uniform vec3 uColor; uniform vec3 uLit; uniform float uAlpha, uGain, uAmb;
